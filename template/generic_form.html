{% extends 'dashboard_base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel form-panel">
  {% if intro %}<p class="text-muted mb-4">{{ intro }}</p>{% endif %}
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %} novalidate>
    {% csrf_token %}
    {% include 'include/form_fields.html' %}
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary" type="submit">{{ submit_label|default:"Save" }}</button>
      <a class="btn btn-outline-secondary" href="{{ back_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
